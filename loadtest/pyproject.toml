[project]
name = "rematar-loadtest"
version = "0.1.0"
description = "RematAR - Entorno de pruebas de carga y rendimiento (Épica 8, Módulo 8.2). Cliente independiente, separado del backend/frontend -- habla con RematAR solo por HTTP/WebSocket, igual que cualquier navegador."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27,<0.28",
    "websockets>=13.0,<14.0",
    "matplotlib>=3.9,<4.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loadtest"]
