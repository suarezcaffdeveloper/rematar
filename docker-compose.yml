services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rematar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rematar}
      POSTGRES_DB: ${POSTGRES_DB:-rematar}
    ports:
      # Host 5434 -> contenedor 5432. Se probó 5432 y 5433 primero, y ambos ya estaban
      # ocupados en esta máquina por Postgres de otros proyectos/servicios nativos —
      # 5434 fue el primer puerto verificado libre (ver README, sección de troubleshooting).
      # Dentro de la red de Docker Compose el backend igual se conecta a "db:5432" (ver
      # DATABASE_URL en .env.example); esto solo afecta el acceso desde el host (ej. un
      # cliente SQL local o los tests corriendo fuera de Docker).
      - "5434:5432"
    volumes:
      - rematar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rematar} -d ${POSTGRES_DB:-rematar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 -> contenedor 6379. Mismo motivo que el mapeo de "db" a 5434: 6379 ya
      # está ocupado en esta máquina por Redis de otro proyecto — 6380 fue el primer
      # puerto verificado libre (ver docs/09-arquitectura-y-decisiones.md). Dentro de la
      # red de Docker Compose el backend igual se conecta a "redis:6379" (ver REDIS_URL
      # en .env.example); esto solo afecta el acceso desde el host.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin volumen a propósito: Redis acá es soporte (Pub/Sub, cache, locks), nunca fuente
    # de verdad (ADR-002) — no hay ningún dato que valga la pena persistir entre
    # reinicios del contenedor.

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules del contenedor, no del host -- los binarios que instala npm
      # (esbuild, etc.) son específicos de la plataforma; si el volumen de arriba
      # pisara este directorio con un node_modules de Windows/Mac, Vite fallaría al
      # arrancar dentro del contenedor Linux. Mismo problema clásico que resuelve
      # cualquier proyecto Node dockerizado con bind mount del código fuente.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    # Sin `env_file`: Vite lee `frontend/.env` directamente (mismo volumen montado
    # arriba), no necesita que Docker Compose se lo inyecte -- y `VITE_API_BASE_URL`
    # tiene que apuntar a "localhost" (lo resuelve el navegador del usuario, fuera de
    # la red de Docker), no al nombre del servicio "backend".

  # UI mínima de administración de la base de datos, útil en desarrollo para inspeccionar
  # tablas sin instalar un cliente Postgres aparte. No forma parte del sistema en sí.
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  rematar_db_data:
  frontend_node_modules:
